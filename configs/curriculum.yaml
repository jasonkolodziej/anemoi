# Two-stage training curriculum (Scope v2.1 §4.6.1).
#
# Read at runtime by anemoi.config (#211): editing a value here changes what
# runs, once deployed (a change under configs/ redeploys the API). A value the
# code can't honour -- a fixed key changed, a wrong type, a derived number
# that disagrees with its inputs -- is refused at import with the file and key
# named. $ANEMOI_CONFIG_DIR points the code at a different copy.
#
# The hard rule: the final stage is always the operational flavor. A run that
# stops after Stage A cannot be registered or promoted.

data:
  # The basins training reads, as ATCF codes (docs/multi_basin.md). One model
  # per architecture is trained on all of them; each is scored and gated on
  # its own (monitoring.yaml promotion). `anemoi hurdat2-fetch` downloads the
  # NHC archive for each: AL from the Atlantic HURDAT2, EP and CP from the
  # Northeast Pacific one. WP, IO and SH need JTWC's tracks, not yet read.
  basins: [AL, EP, CP]

stage_a:
  name: A  # fixed: recorded in run tags
  flavor: era5_pretrain  # fixed: the stage defines it
  input_sources: [era5, besttrack_working]
  label_source: besttrack_final
  season_range: [1980, 2019]
  epochs: 60
  learning_rate: 1.0e-3

stage_b:
  name: B  # fixed: recorded in run tags
  flavor: gdas_finetune  # fixed: the stage defines it
  input_sources: [gdas_gfs, besttrack_working, goes, sst_ohc]
  label_source: besttrack_final
  # 2021 is GDAS's verified real archive start in noaa-gfs-bdp-pds (no data
  # exists before it -- see data/sources.py's gdas_gfs entry); 2023 is the
  # latest season this project's HURDAT2 archive has final best-track labels
  # for. The old [2015, 2019] range predated the real archive entirely --
  # every fix in it would 404 against real GDAS.
  season_range: [2021, 2023]
  # Forecast hour of the GFS fields Stage B trains on (#215). Live cycles
  # read the t-6 cycle's f006 (inference.yaml cycle.nwp_lag_hours): the t
  # analysis isn't published until ~t+3:30, after the cycle has run. Keep
  # equal to that lag; 0 (analyses) is what caches before #215 hold.
  nwp_lead_hours: 6
  epochs: 20
  learning_rate: 1.0e-4
  frozen_modules: [encoder]

# How the transformer is optimised (training/optim.py). Plain Adam at a
# constant 1e-3 left it unfitted on the first multi-basin run (Stage A train
# loss 1.63 on standardised targets, worse than the mean). Each stage's
# learning_rate above is capped at max_learning_rate, warmed up linearly over
# warmup_fraction of the stage's steps, then decayed by cosine to
# min_learning_rate_fraction of the peak; gradients are clipped to
# grad_clip_norm (0 = off). Only the transformer reads these.
transformer:
  max_learning_rate: 3.0e-4
  warmup_fraction: 0.05
  min_learning_rate_fraction: 0.1
  grad_clip_norm: 1.0
  weight_decay: 0.01

# Measured working-vs-final best-track error used to build Stage B inputs.
# These are the documented starting values; replace with the numbers
# `anemoi noise-calibrate --season N` measures from archived as-issued fixes (#216).
working_track_noise:
  position_rms_nm: 15.0
  intensity_rms_kt: 5.0
  pressure_rms_mb: 3.0
  quantise: true
