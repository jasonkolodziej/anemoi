name: Bug report
description: Report a reproducible bug or regression
title: "fix: "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as possible.

  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, stack traces, or screenshots where helpful.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details.
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14, Windows 11]
        - Language / runtime version: [e.g., Node.js 20.x, Python 3.12]
        - Relevant dependency versions:
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## Traceability
        The fields below map directly to the project execution board fields.
        Fill them in so the project item stays aligned with this issue.

  - type: input
    id: source-plan
    attributes:
      label: Source Plan
      description: "Link or reference to the plan section this issue originates from (maps to project field: Source Plan)."
      placeholder: "PLAN.md — e.g. 'Layer 2 — data contracts'"
      value: "PLAN.md"
    validations:
      required: true

  - type: input
    id: parent-plan-section
    attributes:
      label: Parent Plan Section
      description: "The specific section in PLAN.md this issue belongs to (maps to project field: Area)."
      placeholder: "e.g. 'Layer 2 — data contracts'"
    validations:
      required: false

  - type: input
    id: related-project-item
    attributes:
      label: Related Project Item
      description: "Link to the project board item this issue is tracked under."
      placeholder: "https://github.com/users/jasonkolodziej/projects/..."
    validations:
      required: false

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Check each criterion that must be met to close this issue (maps to project field: Acceptance Criteria)."
      options:
        - label: Bug is no longer reproducible
        - label: Root cause is identified and documented
        - label: Regression test added
        - label: Wiki / docs updated if behavior changed
    validations:
      required: false

  - type: textarea
    id: risks-unknowns
    attributes:
      label: Risks / Unknowns
      description: "Any risks or unknowns associated with this fix (maps to project field: Risks / Unknowns)."
    validations:
      required: false

  - type: textarea
    id: depends-on
    attributes:
      label: Depends On
      description: "Issues or PRs that must be resolved before this one."
      placeholder: "- [ ] #issue-number"
    validations:
      required: false

  - type: textarea
    id: blocks
    attributes:
      label: Blocks
      description: "Issues or PRs that are blocked by this one."
      placeholder: "- [ ] #issue-number"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem.
    validations:
      required: false
