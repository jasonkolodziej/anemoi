name: Feature request
description: Suggest a new feature or improvement
title: "feat: "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Fill in as much detail as possible.

  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem / Motivation
      description: "A clear and concise description of the problem this feature solves, or the motivation behind it."
      placeholder: "I find it frustrating that I have to manually X every time Y happens."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you'd like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## Traceability
        The fields below map directly to the project execution board fields.
        Fill them in so the project item stays aligned with this issue.

  - type: input
    id: source-plan
    attributes:
      label: Source Plan
      description: "Link or reference to the plan section this issue originates from (maps to project field: Source Plan)."
      placeholder: "PLAN.md — e.g. 'Layer 3 — training policy'"
      value: "PLAN.md"
    validations:
      required: true

  - type: input
    id: parent-plan-section
    attributes:
      label: Parent Plan Section
      description: "The specific section in PLAN.md this issue belongs to (maps to project field: Area). Valid values: Layer 1 — Time & Geometry; Layer 2 — Data Contracts; Layer 3 — Training Policy; Layer 4 — Tracking; Layer 5 — Inference; Layer 6 — Monitoring & Metrics; Layer 7 — Models; UI / UX; Infrastructure; Documentation."
      placeholder: "e.g. 'Layer 3 — Training Policy'"
    validations:
      required: false

  - type: input
    id: related-project-item
    attributes:
      label: Related Project Item
      description: "Link to the project board item this issue is tracked under."
      placeholder: "https://github.com/users/jasonkolodziej/projects/..."
    validations:
      required: false

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Check each criterion that must be met to close this issue (maps to project field: Acceptance Criteria)."
      options:
        - label: Feature is implemented and functional
        - label: Tests added or updated
        - label: Wiki / docs updated
        - label: Demo or screenshot provided
    validations:
      required: false

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: "List the concrete outputs expected from this feature (maps to project field: Deliverables)."
      placeholder: |
        - [ ] Component X
        - [ ] API endpoint Y
    validations:
      required: false

  - type: textarea
    id: risks-unknowns
    attributes:
      label: Risks / Unknowns
      description: "Any risks or unknowns associated with this feature (maps to project field: Risks / Unknowns)."
    validations:
      required: false

  - type: textarea
    id: depends-on
    attributes:
      label: Depends On
      description: "Issues or PRs that must be resolved before this one."
      placeholder: "- [ ] #issue-number"
    validations:
      required: false

  - type: textarea
    id: blocks
    attributes:
      label: Blocks
      description: "Issues or PRs that are blocked by this one."
      placeholder: "- [ ] #issue-number"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any mockups, references, related issues, or other context.
    validations:
      required: false
