name: Deploy console

# Tests, then deploys the console Worker (anemoi.systems) and its D1 schema
# -- the console counterpart of deploy-docker-api.yml, replacing the manual
# `cd console && pnpm cf:deploy` + hand-run `wrangler d1 execute --file=...`.
#
# test   (every PR and push touching console/): typecheck, build, and run
#        the auth e2e suite against the *built* Worker on workerd
#        (`pnpm test:e2e:workerd` -- the runtime that actually exhibits
#        the bugs vite dev's Node runtime hides), with better-auth's own
#        schema check on against a D1 built from console/migrations/.
# deploy (push to main / manual only, after test passes, behind the
#        cloudflare-production environment's required reviewer -- same
#        gate as docker/api): record a D1 Time Travel restore point, apply
#        new migrations, verify production's schema matches what was just
#        tested, then `wrangler deploy` the exact build the test job tested
#        (an artifact, not a rebuild -- the wiki content baked into
#        /docs is fetched at build time and could otherwise differ).
#
# Order matters: migrations go first, so they must be additive -- the
# previous Worker keeps serving against the new schema until the deploy
# step swaps it (see console/README.md "D1 database").
#
# Needs CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID on the cloudflare-production
# environment (already there for docker/api). The token needs Workers Scripts:
# Edit and D1: Edit on the account, plus Workers Routes: Edit on the
# anemoi.systems zone for the custom domain.

on:
  push:
    branches:
      - main
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/deploy-console.yml"
  pull_request:
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/deploy-console.yml"
  # Manual run: e.g. to pick up wiki edits (/docs is prerendered from the
  # wiki at build time, and wiki edits don't touch this repo).
  workflow_dispatch: {}

concurrency:
  group: deploy-console-${{ github.ref }}
  # Never cancel a run that may be mid-migration/deploy on main; superseded
  # PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: console

jobs:
  test:
    name: Typecheck, build, e2e on workerd
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # `check` runs sync-wiki first (the docs routes import its output).
        run: pnpm run check:errors

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Auth e2e against the built Worker (workerd)
        # global-setup.ts applies console/migrations/ to a fresh local D1;
        # the config turns better-auth's schema check on.
        run: pnpm run test:e2e:workerd

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: console/test-results/
          retention-days: 7

      - name: Upload tested build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: console-build
          # Everything `wrangler deploy` reads: wrangler.jsonc's `main`
          # (cloudflare/_worker.js) imports ../output/server and
          # ../cloudflare-tmp/manifest.js; `assets` is cloudflare/. The
          # generated tsconfig only because console/tsconfig.json extends
          # it and wrangler's bundler warns when it's missing.
          path: |
            console/.svelte-kit/tsconfig.json
            console/.svelte-kit/cloudflare
            console/.svelte-kit/cloudflare-tmp
            console/.svelte-kit/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Migrate D1 + wrangler deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    concurrency:
      group: deploy-console-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        # wrangler itself, plus node_modules for `wrangler deploy`'s bundle
        # step to resolve the server output's external imports.
        run: pnpm install --frozen-lockfile

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: console-build
          path: console/.svelte-kit

      - name: Record D1 restore point
        # Printed to the log so a bad migration can be rolled back with
        # `wrangler d1 time-travel restore anemoi_auth --bookmark=<id>`.
        run: pnpm exec wrangler d1 time-travel info anemoi_auth

      - name: Apply D1 migrations (production)
        # Applies only migrations not yet recorded in production's
        # d1_migrations table; non-interactive here, so no prompt.
        run: pnpm exec wrangler d1 migrations apply anemoi_auth --remote

      - name: Verify production schema matches the tested one
        # Builds the same migrations into a local D1 and checks production
        # has every table/column/index it does -- fails before the Worker
        # ships if production drifted (e.g. a hand edit, or the baseline
        # being a no-op over a schema that didn't actually match).
        run: |
          pnpm exec wrangler d1 migrations apply anemoi_auth --local
          node scripts/verify-d1-schema.mjs

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
