name: "Copilot Setup Steps"

# Run the setup steps when they change (validates the workflow) and allow
# manual test runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job MUST be named `copilot-setup-steps` for the cloud agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Minimal permissions required for the setup steps below.
    # Copilot is granted its own token for its own operations.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The graphify MCP server (code knowledge graph, see AGENTS.md) runs via
      # uvx; warm its environment so the agent's first tool call is fast.
      # Version matches GRAPHIFY_VERSION in .github/workflows/graphify.yml.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install graphify
        run: uvx --from "graphifyy[mcp]==0.9.97" graphify --help > /dev/null

      # ---------------------------------------------------------------
      # Add project-specific setup steps below.
      # Examples: install Node.js, Python, Go, or other runtimes;
      # restore dependency caches; install CLI tools, etc.
      # ---------------------------------------------------------------

