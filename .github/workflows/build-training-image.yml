name: Build training image

# Builds the Cloud Run training image (CUDA torch) on a GitHub-hosted runner,
# pushes it to Artifact Registry, and points the anemoi-train-schedule job at
# it, so the next training execution runs what is on main.
#
# Fast when only code or configs change: docker/multistage.Dockerfile keeps
# the dependencies (several GB) in a layer of their own that depends only on
# uv.lock and pyproject.toml, and the build cache lives in Artifact Registry
# (anemoi-train:buildcache). A code change rebuilds and pushes only the small
# project layers; the dependency layer is reused from the cache, and the
# registry already holds it. A uv.lock change rebuilds it in full.
#
# On a pull request that changes how the image is built (not a code change),
# it builds without the cache or GCP access, smoke-tests the image, and
# checks torch is still the locked CUDA build. Nothing is pushed.
#
# Auth is Workload Identity Federation, no stored key: GCP trusts only this
# repository's main branch, as the anemoi-ci-build service account. One-time
# setup: docker/cloud-run-training/setup-ci.sh (see README.md, "Build on
# every push to main").
#
# Repository variables (Settings > Secrets and variables > Actions >
# Variables), not secrets -- neither value grants anything on its own:
#   GCP_WIF_PROVIDER        projects/<number>/locations/global/workloadIdentityPools/github/providers/anemoi-repo
#   GCP_CI_SERVICE_ACCOUNT  anemoi-ci-build@anemoi-training.iam.gserviceaccount.com
# How to look either up: the README section above, "The two repository
# variables".
#
# docker/cloud-run-training/cloudbuild.yaml still builds the same image on
# Cloud Build by hand, if ever needed.
#
# Updating the job doesn't touch an execution already running: it keeps the
# image it started with.

on:
  push:
    branches:
      - main
    paths:
      # What the training image is built from.
      - src/**
      - configs/**
      - pyproject.toml
      - uv.lock
      - docker/multistage.Dockerfile
      - docker/multistage.Dockerfile.dockerignore
      - docker/cloud-run-training/**
      - .github/scripts/write-build-info.sh
      - .github/scripts/smoke-test-image.sh
      - .github/workflows/build-training-image.yml
  pull_request:
    paths:
      # How the image is built, not the code in it: a code change can't
      # break the image's layout, and a cold CUDA build is long.
      - pyproject.toml
      - uv.lock
      - docker/multistage.Dockerfile
      - docker/multistage.Dockerfile.dockerignore
      - docker/cloud-run-training/entrypoint.sh
      - .github/scripts/write-build-info.sh
      - .github/scripts/smoke-test-image.sh
      - .github/workflows/build-training-image.yml
  workflow_dispatch:
    inputs:
      update_job:
        description: Point anemoi-train-schedule at the new image
        type: boolean
        default: true

# On main, one build at a time in push order: a newer push waits rather
# than racing the older one to update the job (GitHub keeps only the newest
# waiting run). A superseded PR build is cancelled.
concurrency:
  group: build-training-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  PROJECT_ID: anemoi-training
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/anemoi-training/anemoi/anemoi-train
  JOB: anemoi-train-schedule
  # Pushes and updates the job; false on pull requests.
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: "Build training image${{ github.event_name == 'pull_request' && ' (check only)' || '' }}"
    runs-on: ubuntu-latest
    # A cold CUDA build (no cache: first run, a uv.lock change, every PR
    # run) is the slow case.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        # The CUDA dependencies are several GB, held by the builder and again
        # by the image loaded for the smoke test. The runner's preinstalled
        # SDKs this workflow never uses free ~30 GB.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null
          df -h / | tail -1

      - name: Check the repository variables are set
        if: env.PUBLISH == 'true'
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for v in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set (Settings > Secrets and variables > Actions > Variables). See docker/cloud-run-training/README.md, \"The two repository variables\"."
              missing=1
            fi
          done
          exit $missing

      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up gcloud
        if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Record the commit for the image
        # anemoi.provenance (#214): registered models record the commit.
        run: .github/scripts/write-build-info.sh "$GITHUB_SHA"

      - name: Image metadata
        id: meta
        run: |
          tag="${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            # mode=max: the builder stages too, so training-deps' layer is
            # reused even though the runtime image only copies from it.
            echo "cache_from=type=registry,ref=$IMAGE:buildcache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and load locally first: an image that can't find its configs
      # (read at import since #211) must fail here, not in a Cloud Run job.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/multistage.Dockerfile
          target: training
          load: true
          push: false
          tags: anemoi-train:smoke
          cache-from: ${{ steps.meta.outputs.cache_from }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.tag }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke-test the training image
        env:
          EXPECT_GIT_SHA: ${{ github.sha }}
        run: .github/scripts/smoke-test-image.sh anemoi-train:smoke training

      - name: Check torch is the locked CUDA build
        # The image must carry the CUDA torch uv.lock pins from PyPI (the
        # torch extra), not the CPU-only build from PyTorch's own index (the
        # api image's torch-cpu extra).
        run: |
          expected=$(python3 -c '
          import tomllib
          lock = tomllib.load(open("uv.lock", "rb"))
          versions = {p["version"] for p in lock["package"]
                      if p["name"] == "torch" and p.get("source", {}).get("registry") == "https://pypi.org/simple"}
          assert len(versions) == 1, versions
          print(versions.pop())')
          docker run --rm --entrypoint python -e EXPECTED="$expected" anemoi-train:smoke -c '
          import os, torch
          print("torch", torch.__version__, "| CUDA", torch.version.cuda, "| expected", os.environ["EXPECTED"])
          assert torch.__version__ == os.environ["EXPECTED"], "not the locked torch"
          assert torch.version.cuda, "torch has no CUDA build"'

      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/multistage.Dockerfile
          target: training
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Same inputs as the build above, so every layer comes from the
          # builder's local cache: a push of the tested image, not a rebuild.
          cache-from: ${{ steps.meta.outputs.cache_from }}
          cache-to: ${{ steps.meta.outputs.cache_to }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.tag }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Point the job at the new image
        if: env.PUBLISH == 'true' && (github.event_name == 'push' || inputs.update_job)
        run: |
          gcloud run jobs update "$JOB" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:${{ steps.meta.outputs.tag }}"
          echo "$JOB now runs \`$IMAGE:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
