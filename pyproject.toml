[project]
name = "anemoi"
version = "2.2.0"
description = "Anemoi hurricane forecast platform: Anemoi-Core deterministic engine + Anemoi-Spread diffusion ensemble (Scope v2.1)"
readme = "README.md"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
#: numpy's floor tracks the oldest version this project actually tests
#: against, not an old default -- 2.5.x itself requires Python>=3.12
#: (this project supports >=3.11), so 2.4.6 is the real floor across the
#: whole supported range, not 2.5.3. See uv.lock: 2.4.6 (Python<3.12) /
#: 2.5.3 (Python>=3.12) are both already the newest release installable
#: for their respective interpreter, confirmed live against PyPI.
dependencies = ["numpy>=2.4.6", "pyyaml>=6.0"]

[project.optional-dependencies]
# Torch-backed model implementations. Kept optional so the operational logic
# (scheduling, availability, curriculum, promotion, metrics) can be installed,
# tested and run on machines without a GPU or a torch wheel.
torch = ["torch>=2.2"]
# MLflow tracking. The tracking layer degrades to a local JSON store when
# MLflow is absent (see anemoi.tracking.registry), per Scope v2.1 §10.1.
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx2>=2.0"]
# Anemoi-API: the HTTP developer interface over the reference implementation.
# Needs only the core deps (numpy/pyyaml) underneath -- no torch required to
# serve the demo/schedule/registry/monitoring routes.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Real GriddedFields: ERA5 via the public ARCO-ERA5 Zarr store (anonymous
# GCS access, no CDS account) and GDAS/GFS via byte-range GRIB2 fetches
# against NOAA's public AWS Open Data bucket (also anonymous). ERA5 needs no
# system package (xarray/zarr/gcsfs are all pure-Python wheels). GDAS's
# `eccodes` PyPI package is pure-Python *bindings* only -- it does NOT bundle
# the compiled `libeccodes` library (an earlier version of this comment
# claimed it did; verified wrong on both macOS and Ubuntu 22.04) -- install
# it separately: `sudo apt-get install libeccodes0` on Debian/Ubuntu,
# `brew install eccodes` on macOS. See anemoi.data.real_gridded.
gridded = [
    "xarray>=2024.1", "zarr>=2.17", "gcsfs>=2024.1", "eccodes>=2.30", "requests>=2.31",
    # NetCDF4 reader for data.real_sst's OISST fetch -- pure-Python-wheel
    # h5py (no compiled system library needed, unlike eccodes), confirmed
    # 2026-09-22.
    "h5netcdf>=1.3", "h5py>=3.10",
    # Real geostationary-projection math for data.real_goes -- battle-tested
    # over hand-rolled trig, since a projection bug would silently misplace
    # every crop rather than raise. Prebuilt wheel, no system library needed.
    "pyproj>=3.6",
]
# Durable checkpoint storage against an S3-compatible endpoint (Cloudflare R2
# or AWS S3). See anemoi.tracking.checkpoint_store and example.env.
storage = ["boto3>=1.34"]
all = ["anemoi[torch,tracking,dev,api,gridded,storage]"]

[project.scripts]
anemoi = "anemoi.cli:main"

# MLflow discovers this automatically (importlib.metadata entry points) once
# the package is installed with the tracking extra -- adds the Cloudflare
# Access service-token headers docker/mlflow/'s server needs when deployed
# behind a Cloudflare Tunnel + Access, to every outgoing MLflow REST request.
# See anemoi.tracking.cloudflare_access's module docstring.
[project.entry-points."mlflow.request_header_provider"]
cloudflare_access = "anemoi.tracking.cloudflare_access:CloudflareAccessRequestHeaderProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anemoi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "torch: requires the optional torch extra (skipped automatically if absent)",
    "slow: long-running training-shaped tests",
    "api: requires the optional api extra, fastapi (skipped automatically if absent)",
    "gridded: requires the optional gridded extra, xarray/zarr/eccodes (skipped automatically if absent)",
    "storage: requires the optional storage extra, boto3 (skipped automatically if absent)",
    "tracking: requires the optional tracking extra, mlflow (skipped automatically if absent)",
    "network: makes a real network call to a public data source (skipped by default; run with -m network)",
    "mlflow_live: makes a real network call to a configured MLflow tracking server (skipped automatically unless MLFLOW_TRACKING_URI is set)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
