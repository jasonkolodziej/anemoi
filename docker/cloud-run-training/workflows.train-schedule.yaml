# Runs Cloud Run jobs one after another, stopping at the first that fails.
#
# The `jobs.run` connector waits for the job's execution to finish and returns
# that Execution; a failed or cancelled execution makes the call raise, which
# ends the workflow. `timeoutSeconds` is the connector's wait limit per job --
# its default is only 30 minutes, shorter than any real training job.
#
# Args (all optional except a project, which defaults to the workflow's own):
#   projectId, region, jobs (list of job names), timeoutSeconds
main:
  params: [args]
  steps:
    # `{}` isn't allowed inside an expression, so default to an empty map
    # here and override it only when the run passed arguments.
    - defaultArgs:
        assign:
          - inputArgs: {}
    - readArgs:
        switch:
          - condition: ${args != null}
            steps:
              - useArgs:
                  assign:
                    - inputArgs: ${args}
    - init:
        assign:
          - projectId: ${default(map.get(inputArgs, "projectId"), sys.get_env("GOOGLE_CLOUD_PROJECT_ID"))}
          - region: ${default(map.get(inputArgs, "region"), "us-central1")}
          - jobs: ${default(map.get(inputArgs, "jobs"), ["anemoi-train-lstm", "anemoi-train-cnn", "anemoi-train-transformer", "anemoi-train-gnn", "anemoi-train-pinn", "anemoi-train-derived"])}
          - timeoutSeconds: ${default(map.get(inputArgs, "timeoutSeconds"), 7200)}
          - results: []

    - runJobsInOrder:
        for:
          value: job
          in: ${jobs}
          steps:
            - runJob:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + region + "/jobs/" + job}
                  connector_params:
                    timeout: ${timeoutSeconds}
                result: execution

            # The connector normally raises for a failed execution already;
            # this also catches one that returns with failed or cancelled
            # tasks. Zero-valued counts are omitted from the response, hence
            # map.get with a default rather than direct field access.
            - checkSucceeded:
                switch:
                  - condition: ${default(map.get(execution, "failedCount"), 0) > 0 or default(map.get(execution, "cancelledCount"), 0) > 0}
                    raise: '${"job " + job + " finished with failed or cancelled tasks: " + execution.name}'

            - collectResult:
                assign:
                  - one:
                      job: ${job}
                      execution: ${execution.name}
                      completionTime: ${default(map.get(execution, "completionTime"), null)}
                  - results: ${list.concat(results, [one])}

    - done:
        return:
          status: "SUCCEEDED"
          projectId: ${projectId}
          region: ${region}
          jobs: ${results}
