# Builds the `training` target of docker/multistage.Dockerfile (shared with
# the Cloudflare Containers API image) and pushes it to Artifact Registry.
# `gcloud builds submit --tag` can't do this on its own: it only builds a
# Dockerfile at the root of the uploaded source.
#
#   gcloud builds submit --config docker/cloud-run-training/cloudbuild.yaml \
#     --substitutions _IMAGE=us-central1-docker.pkg.dev/${PROJECT_ID}/anemoi/anemoi-train,_TAG=$(git rev-parse --short=12 HEAD) .
steps:
  # The commit the image is built from (anemoi.provenance, #214). Not from
  # the uploaded source: build-info.json is gitignored, so gcloud never
  # uploads one. _TAG is the commit when submitted as documented above.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [.github/scripts/write-build-info.sh, $_TAG]
  - name: gcr.io/cloud-builders/docker
    # BuildKit rather than this builder's default legacy engine.
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f
      - docker/multistage.Dockerfile
      - --target
      - training
      - --build-arg
      - VCS_REF=$_TAG
      - --build-arg
      - VERSION=$_TAG
      - -t
      - $_IMAGE:$_TAG
      - -t
      - $_IMAGE:latest
      - .
  # `images:` below only pushes once every step has succeeded, so a training
  # image that can't find its configs (read at import since #211) never
  # reaches Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [.github/scripts/smoke-test-image.sh, $_IMAGE:$_TAG, training]
images:
  - $_IMAGE:$_TAG
  - $_IMAGE:latest
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/anemoi-training/anemoi/anemoi-train
  _TAG: manual
options:
  # The CUDA torch wheels make this a large image; the default machine's
  # disk and CPU make the build slow and can run out of space.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
